project:
  name: vietnamese-financial-kg
  timezone: Asia/Ho_Chi_Minh

vertical_slice:
  article_limit: 100
  # Danh sách VN30 sau kỳ rà soát tháng 7/2026, hiệu lực từ 2026-08-03.
  universe_reference_date: "2026-10-16"
  stock_symbols:
    - ACB
    - BID
    - CTG
    - HDB
    - LPB
    - MBB
    - SHB
    - SSB
    - STB
    - TCB
    - VCB
    - VIB
    - VPB
  benchmark_index: VNINDEX
  market_observation_date_from: "2026-07-16"
  market_observation_date_to: "2026-10-16"
  # Chọn khoảng thời gian sau khi chốt tập 100 bài và kiểm tra coverage dữ liệu giá.
  article_date_from: null
  article_date_to: null

market_data:
  # Cố định một backend để adjusted close không đổi phương pháp giữa các lần crawl.
  source: kbs

extractor:
  provider: huggingface
  model_id: vinai/phobert-base-v2
  checkpoint_path: models/phobert_bkee_event_detection_v2
  entity_checkpoint_path: models/phobert_bkee_emd_v1
  trigger_conditioned_argument_checkpoint_path: models/phobert_bkee_eae_trigger_conditioned_v1
  label_mapping_path: models/phobert_bkee_event_detection_v2/label_mapping.json
  model_version: "bkee-bio-dev-selected-v2"
  event_detection_task: BKEE_EVENT_DETECTION_BIO_TOKEN_CLASSIFICATION
  event_type_system: BKEE_33_TYPES
  device: null
  # Chỉ gắn cờ rà soát body ngắn; không loại body khỏi đầu vào trích xuất.
  short_body_review_chars: 500

event_study:
  # Offsets là phiên giao dịch tương đối với effectiveTradingDate.
  effective_date_cutoff: "08:00:00"
  cutoff_timezone: Asia/Ho_Chi_Minh
  window_start_offset: 0
  window_end_offset: 3
  supplemental_window_start_offset: 1
  supplemental_window_end_offset: 3
  market_timezone: Asia/Ho_Chi_Minh
  benchmark_index: VNINDEX

paths:
  schema_ontology: schema/ontology.ttl
  schema_shapes: schema/shapes.ttl
  raw_initial_data: data/raw/initial_data_load
  raw_daily: data/raw/daily
  snapshots: data/snapshots
  gold: data/gold
  output: data/output
  runs: runs
  # Cohort khóa cố định để mọi lần build KG dùng cùng đúng 100 bài báo.
  news_selection_manifest: data/output/news_article_selection_manifest.json

# URL Vietstock lấy từ liên kết nội bộ trên trang nguồn hoặc được xác minh
# trực tiếp bằng mã/sàn hiển thị. URL CafeF cũng được crawler đối chiếu mã trước khi lưu.
